services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 留空则自动进入离线模式（内置规则模型），照样能跑通完整链路
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      NL2SQL_DB_PATH: /app/data/ecommerce.db
      NL2SQL_MAX_ROWS: "200"
      NL2SQL_CACHE_TTL_S: "600"
